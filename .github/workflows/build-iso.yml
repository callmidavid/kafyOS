name: Build Kafy OS ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "distro/kafy/**"
      - ".github/workflows/build-iso.yml"

jobs:
  build-iso:
    name: Build Arch ISO
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Kafy Arch ISO
        run: |
          docker run --rm \
            --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/distro/kafy \
            archlinux:latest \
            bash -lc 'pacman -Syu --noconfirm archiso && ./build.sh /workspace/artifacts'

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: kafy-os-x86_64-iso
          path: |
            artifacts/*.iso
            artifacts/*.iso.sha256
          retention-days: 14
