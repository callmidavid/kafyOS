LABEL kafy
  MENU LABEL Boot Kafy OS (%ARCH%, BIOS)
  TEXT HELP
  Boot Kafy OS live environment.
  ENDTEXT
  LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL kafy-fallback
  MENU LABEL Boot Kafy OS (%ARCH%, BIOS, fallback initramfs)
  TEXT HELP
  Boot Kafy OS with fallback initramfs.
  ENDTEXT
  LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-fallback.img
  APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
