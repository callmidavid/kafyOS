# Kafy Hyprland session — macOS inspired calm & fluid defaults
monitor=,preferred,auto,1

exec-once = hyprpaper
exec-once = waybar
exec-once = swaync
exec-once = nm-applet --indicator
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = /usr/local/bin/kafy-welcome

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(818cf8ee) rgba(c084fcee) 45deg
    col.inactive_border = rgba(30303a88)
    layout = dwindle
}

decoration {
    rounding = 14

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        vibrancy = 0.2
    }

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(00000044)
    }
}

animations {
    enabled = true
    bezier = fluid, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, fluid
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, fluid
}

# Floating window rules for welcome & installer. `windowrulev2` was removed
# from current Hyprland releases; retain hyprlang compatibility while Kafy
# migrates the rest of its session configuration to the supported Lua format.
windowrule = float, match:class ^(kafy-welcome)$
windowrule = size 780 540, match:class ^(kafy-welcome)$
windowrule = center, match:class ^(kafy-welcome)$

$mainMod = SUPER
bind = $mainMod, SPACE, exec, rofi -show drun
bind = $mainMod, RETURN, exec, foot
bind = $mainMod, E, exec, thunar
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, M, exit
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
