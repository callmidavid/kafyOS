# Kafy Hyprland session — first bootable desktop baseline.
monitor=,preferred,auto,1

exec-once = hyprpaper
exec-once = waybar
exec-once = swaync
exec-once = nm-applet --indicator
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

input {
    kb_layout = us
    follow_mouse = 1
    touchpad { natural_scroll = true; tap-to-click = true; }
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(6366f1ff)
    col.inactive_border = rgba(30303aff)
    layout = dwindle
}

decoration {
    rounding = 12
    blur { enabled = true; size = 6; passes = 2; }
    shadow { enabled = true; range = 12; render_power = 3; }
}

animations {
    enabled = true
    animation = windows, 1, 5, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default
}

$mainMod = SUPER
bind = $mainMod, SPACE, exec, rofi -show drun
bind = $mainMod, RETURN, exec, foot
bind = $mainMod, E, exec, thunar
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, M, exit
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
