# Extra autostart processes
# exec-once = uwsm-app -- my-service
exec-once = wl-paste --watch cliphist store
exec-once = awww-daemon
exec-once = sh -c 'for i in $(seq 1 50); do awww query >/dev/null 2>&1 && break; sleep 0.2; done; bg=$(readlink -f "$HOME/.config/theme/current/background" 2>/dev/null); [ -n "$bg" ] && [ -f "$bg" ] && awww img "$bg" --transition-type none'
exec-once = ~/.local/bin/matugen-cursor
exec-once = quickshell -p ~/.config/quickshell
exec-once = pkill -x swayosd-server
# Wipe runaway capture overlays (slurp/hyprpicker) if a key ever sticks at login
exec-once = ~/.config/hypr/scripts/picker-guard.sh

# Kafy live-session welcome/installer — present only on the ISO, so guard it.
exec-once = sh -c '[ -x /usr/local/bin/kafy-welcome ] && /usr/local/bin/kafy-welcome'
